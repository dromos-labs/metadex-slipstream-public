name: lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: wagoid/commitlint-github-action@v5

      - name: install-tools
        uses: ./.github/workflows/install-tools

      - name: Prettier check
        run: yarn format:check

      - name: Forge formatter check
        run: yarn fmt:check

      - name: Solhint
        run: yarn lint:sol
