name: Fuzz Testing

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  echidna:
    name: Echidna
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: install-tools
        uses: ./.github/workflows/install-tools

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install solc-select + slither + crytic-compile
        # slither powers echidna's coverage-guided fuzzing; without it echidna
        # runs in pure-random mode (Unique instructions: 0, Corpus size: 0).
        # crytic-compile is a slither-analyzer dep but pinned explicitly so the
        # echidna compile step keeps working even if slither's deps shift.
        run: pip install solc-select slither-analyzer crytic-compile

      - name: Cache solc-select artifacts
        uses: actions/cache@v4
        with:
          path: ~/.solc-select
          key: solc-select-0.7.6

      - name: Install solc 0.7.6
        run: |
          solc-select install 0.7.6
          solc-select use 0.7.6

      - name: Cache echidna binary
        id: echidna-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/echidna
          key: echidna-2.2.6-linux

      - name: Install echidna
        if: steps.echidna-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          wget -O /tmp/echidna.tar.gz https://github.com/crytic/echidna/releases/download/v2.2.6/echidna-2.2.6-x86_64-linux.tar.gz
          tar -xf /tmp/echidna.tar.gz -C ~/.local/bin
          chmod +x ~/.local/bin/echidna

      - name: Add echidna to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run all echidna tests
        run: |
          FAILED=()
          for f in contracts/core/test/*EchidnaTest.sol; do
            name=$(basename "$f" .sol)
            echo "::group::$name"
            if echidna "$f" --contract "$name" --config echidna.config.yml; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              FAILED+=("$name")
            fi
          done
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Failed echidna tests: ${FAILED[*]}"
            exit 1
          fi
