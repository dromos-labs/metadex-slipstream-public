[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.7.6"
optimizer = true
optimizer_runs = 200

fs_permissions = [{ access = "read-write", path = "./"}]

no_match_test = "testEchidna|testGasFork"
no_match_contract = "VerifyDeployCL"

show_progress = true

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[fuzz]
runs = 256

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
optimism = "${OPTIMISM_RPC_URL}"

[etherscan]
optimism = { key = "${OPTIMISM_ETHERSCAN_API_KEY}", url = "${OPTIMISM_ETHERSCAN_VERIFIER_URL}" }