[fmt]
line_length = 120
tab_width = 2
bracket_spacing = false
int_types = 'long'
quote_style = 'single'
number_underscore = 'thousands'
multiline_func_header = 'params_first_multi'
sort_imports = true

[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.7.6"
evm_version = "istanbul"

# We use explicit remappings from remappings.txt
auto_detect_remappings = false

optimizer = true
optimizer_runs = 200
show_progress = true
