[lintspec]
# `paths` is the default scan target. Update this list as new 0.8.x module paths
# get added. Empty list = no default scan; run `yarn lint:natspec <file>` to
# check a specific file. lintspec is installed separately via cargo/release,
# not npm — see https://github.com/beeb/lintspec.
paths = []
exclude = []
inheritdoc = true
notice_or_dev = false
skip_version_detection = true

[output]
json = false
compact = false
sort = false

[constructor]
notice = "required"
dev = "ignored"
param = "required"

[enum]
notice = "required"
dev = "ignored"
param = "required"

[error]
notice = "required"
dev = "ignored"
param = "required"

[event]
notice = "required"
dev = "ignored"
param = "required"

[function.private]
notice = "required"
dev = "ignored"
param = "required"
return = "required"

[function.internal]
notice = "required"
dev = "ignored"
param = "required"
return = "required"

[function.public]
notice = "required"
dev = "ignored"
param = "required"
return = "required"

[function.external]
notice = "required"
dev = "ignored"
param = "required"
return = "required"

[modifier]
notice = "required"
dev = "ignored"
param = "required"

[struct]
notice = "required"
dev = "ignored"
param = "required"

[variable.private]
notice = "required"
dev = "ignored"

[variable.internal]
notice = "required"
dev = "ignored"

[variable.public]
notice = "required"
dev = "ignored"
return = "required"
